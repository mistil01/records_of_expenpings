<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finance Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <div class="app-shell">
        <header class="top-bar">
            <div>
                <p class="eyebrow">Personal finance</p>
                <h1>Finance Tracker</h1>
            </div>
            <button id="logoutBtn" class="logout-btn hidden">Logout</button>
        </header>

        <main>
            <section id="authSection" class="auth-panel">
                <div class="auth-card">
                    <div class="auth-tabs">
                        <button class="auth-tab active" data-mode="login">Login</button>
                        <button class="auth-tab" data-mode="register">Register</button>
                    </div>

                    <form id="loginForm" class="auth-form active-form">
                        <h2>Welcome back</h2>
                        <input type="text" id="loginUsername" placeholder="Username" required>
                        <input type="password" id="loginPassword" placeholder="Password" required>
                        <button type="submit">Login</button>
                    </form>

                    <form id="registerForm" class="auth-form">
                        <h2>Create account</h2>
                        <input type="text" id="registerUsername" placeholder="Username" required>
                        <input type="email" id="registerEmail" placeholder="Email" required>
                        <input type="password" id="registerPassword" placeholder="Password" required>
                        <button type="submit">Register</button>
                    </form>
                    <p id="authMessage" class="auth-message"></p>
                </div>
            </section>

            <section id="dashboardSection" class="dashboard hidden">
                <section class="dashboard-header">
                    <div>
                        <p class="eyebrow">Overview</p>
                        <h2>Welcome back</h2>
                    </div>
                    <div class="header-pill" id="todayLabel">Today</div>
                </section>

                <section class="summary-grid">
                    <div class="summary-card income">
                        <span>Total Income</span>
                        <strong id="incomeTotal">0.00</strong>
                    </div>
                    <div class="summary-card expense">
                        <span>Total Expense</span>
                        <strong id="expenseTotal">0.00</strong>
                    </div>
                    <div class="summary-card balance">
                        <span>Balance</span>
                        <strong id="balanceTotal">0.00</strong>
                    </div>
                </section>

                <section class="insight-grid">
                    <div class="panel insight-panel">
                        <p class="insight-label">Recent activity</p>
                        <strong id="recentCount">0 entries</strong>
                    </div>
                    <div class="panel insight-panel">
                        <p class="insight-label">Most used category</p>
                        <strong id="topCategory">—</strong>
                    </div>
                </section>

                <section class="content-grid">
                    <div class="panel transaction-form-panel">
                        <h3 id="transactionFormTitle">Add transaction</h3>
                        <form id="transactionForm">
                            <div class="form-row">
                                <select id="transactionType" required>
                                    <option value="income">Income</option>
                                    <option value="expense">Expense</option>
                                </select>
                                <input type="number" id="transactionAmount" step="0.01" min="0" placeholder="Amount" required>
                            </div>
                            <input type="text" id="transactionCategory" placeholder="Category" required>
                            <textarea id="transactionDescription" rows="3" placeholder="Description"></textarea>
                            <button id="transactionSubmitBtn" type="submit">Save transaction</button>
                            <button id="cancelEditBtn" class="cancel-btn hidden" type="button">Cancel edit</button>
                        </form>
                    </div>

                    <div class="panel transaction-list-panel">
                        <h3>Recent transactions</h3>
                        <div class="table-wrap">
                            <table>
                                <thead>
                                    <tr>
                                        <th>Date</th>
                                        <th>Type</th>
                                        <th>Category</th>
                                        <th>Amount</th>
                                        <th>Actions</th>
                                    </tr>
                                </thead>
                                <tbody id="transactionsBody"></tbody>
                            </table>
                        </div>
                    </div>
                </section>
            </section>
        </main>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
